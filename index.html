<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Camera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        video.active { display: block; }
        #placeholder {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #placeholder .icon { font-size: 64px; opacity: 0.5; }
        #placeholder p { opacity: 0.7; font-size: 16px; }
        #controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        button {
            border: none;
            background: #fff;
            color: #000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        button:active { transform: scale(0.9); }
        #start-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
        }
        #capture-btn {
            width: 70px;
            height: 70px;
            border: 4px solid #fff;
            background: #fff;
        }
        #capture-btn::after {
            content: '';
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #000;
        }
        #capture-btn:active::after { background: #ccc; }
        #switch-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        #gallery {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        #gallery.active { display: flex; }
        #gallery img {
            flex: 1;
            object-fit: contain;
            width: 100%;
        }
        #gallery-controls {
            padding: 20px;
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.8);
        }
        #gallery-controls button {
            width: 60px;
            height: 60px;
            font-size: 20px;
        }
        .close-btn { background: #ff4444 !important; color: #fff !important; }
        .download-btn { background: #4CAF50 !important; color: #fff !important; }
        .hidden { display: none !important; }
        #flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.1s;
        }
        #flash.active { opacity: 1; }
        #counter {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
        }
        #counter.active { display: block; }
        #error-msg {
            color: #ff4444;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            display: none;
        }
        #permission-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            z-index: 200;
            gap: 24px;
        }
        #permission-screen.hidden { display: none !important; }
        #permission-screen .icon { font-size: 80px; }
        #permission-screen h2 { font-size: 24px; }
        #permission-screen p { opacity: 0.7; font-size: 16px; line-height: 1.5; }
        #grant-btn {
            width: auto;
            height: auto;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            background: #fff;
            color: #000;
        }
        #retry-btn {
            width: auto;
            height: auto;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        .spinner.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            font-size: 14px;
            opacity: 0.7;
            display: none;
        }
        #loading-text.active { display: block; }
    </style>
</head>
<body>
    <div id="flash"></div>

    <!-- Permission Screen -->
    <div id="permission-screen">
        <div class="icon">📷</div>
        <h2>Camera Access</h2>
        <p>This app needs access to your camera to take photos. Your camera data stays on your device and is never uploaded.</p>
        <button id="grant-btn">Allow Camera Access</button>
        <div class="spinner" id="spinner"></div>
        <p id="loading-text">Requesting permission...</p>
        <button id="retry-btn" class="hidden">Try Again</button>
    </div>

    <div id="video-container">
        <div id="placeholder">
            <div class="icon">📷</div>
            <p>Camera is ready</p>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <div id="counter">📸 <span id="photo-count">0</span></div>
    </div>

    <div id="error-msg"></div>

    <div id="controls">
        <button id="start-btn" title="Start Camera">▶️</button>
        <button id="capture-btn" class="hidden" title="Take Photo"></button>
        <button id="switch-btn" class="hidden" title="Switch Camera">🔄</button>
    </div>

    <div id="gallery">
        <img id="gallery-img" src="" alt="Captured photo">
        <div id="gallery-controls">
            <button class="close-btn" title="Close">❌</button>
            <button class="download-btn" title="Download">💾</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const placeholder = document.getElementById('placeholder');
        const gallery = document.getElementById('gallery');
        const galleryImg = document.getElementById('gallery-img');
        const flash = document.getElementById('flash');
        const counter = document.getElementById('counter');
        const photoCount = document.getElementById('photo-count');
        const errorMsg = document.getElementById('error-msg');
        const permissionScreen = document.getElementById('permission-screen');
        const grantBtn = document.getElementById('grant-btn');
        const retryBtn = document.getElementById('retry-btn');
        const spinner = document.getElementById('spinner');
        const loadingText = document.getElementById('loading-text');

        let stream = null;
        let currentFacing = 'environment';
        let photos = [];
        let permissionGranted = false;

        // Check browser support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showPermissionError('Your browser does not support camera access. Please use Chrome, Safari, or Firefox.');
            grantBtn.style.display = 'none';
        }

        function showPermissionError(msg) {
            const p = permissionScreen.querySelector('p');
            p.textContent = msg;
            p.style.color = '#ff4444';
            spinner.classList.remove('active');
            loadingText.classList.remove('active');
            grantBtn.classList.add('hidden');
            retryBtn.classList.remove('hidden');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
        }

        async function requestPermission() {
            spinner.classList.add('active');
            loadingText.classList.add('active');
            grantBtn.classList.add('hidden');

            try {
                // First, try to enumerate devices to see if cameras exist
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                if (videoDevices.length === 0) {
                    showPermissionError('No camera found on this device.');
                    return;
                }

                // Now request actual permission
                const testStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacing },
                    audio: false
                });
                
                // Permission granted! Stop the test stream
                testStream.getTracks().forEach(track => track.stop());
                
                permissionGranted = true;
                permissionScreen.classList.add('hidden');
                
                // Auto-start camera
                await startCamera();
                
            } catch (err) {
                console.error('Permission error:', err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showPermissionError('Camera permission was denied. Please allow camera access in your browser settings and tap Try Again.');
                } else if (err.name === 'NotFoundError') {
                    showPermissionError('No camera found on this device.');
                } else if (err.name === 'NotReadableError') {
                    showPermissionError('Camera is already in use by another app. Please close other apps using the camera.');
                } else {
                    showPermissionError('Could not access camera: ' + err.message);
                }
            }
        }

        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: currentFacing,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                video.classList.add('active');
                placeholder.style.display = 'none';
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                switchBtn.classList.remove('hidden');
                counter.classList.add('active');

            } catch (err) {
                console.error('Camera start error:', err);
                showError('Failed to start camera: ' + err.message);
                // Show permission screen again
                permissionScreen.classList.remove('hidden');
                showPermissionError('Could not start camera. Please check permissions.');
            }
        }

        function takePhoto() {
            if (!stream) return;

            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;

            const ctx = canvas.getContext('2d');
            
            if (currentFacing === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0);
            
            const photoData = canvas.toDataURL('image/jpeg', 0.9);
            photos.push(photoData);
            photoCount.textContent = photos.length;

            galleryImg.src = photoData;
            gallery.classList.add('active');
        }

        function switchCamera() {
            currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        function closeGallery() {
            gallery.classList.remove('active');
        }

        function downloadPhoto() {
            const link = document.createElement('a');
            link.download = `photo_${photos.length}_${Date.now()}.jpg`;
            link.href = galleryImg.src;
            link.click();
        }

        // Event listeners
        grantBtn.addEventListener('click', requestPermission);
        retryBtn.addEventListener('click', requestPermission);
        startBtn.addEventListener('click', startCamera);
        captureBtn.addEventListener('click', takePhoto);
        switchBtn.addEventListener('click', switchCamera);
        document.querySelector('.close-btn').addEventListener('click', closeGallery);
        document.querySelector('.download-btn').addEventListener('click', downloadPhoto);

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
