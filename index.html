<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Camera</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.20.0/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        video.active { display: block; }
        #placeholder {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #placeholder .icon { font-size: 64px; opacity: 0.5; }
        #placeholder p { opacity: 0.7; font-size: 16px; }
        #controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        button {
            border: none;
            background: #fff;
            color: #000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        button:active { transform: scale(0.9); }
        #start-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
        }
        #capture-btn {
            width: 70px;
            height: 70px;
            border: 4px solid #fff;
            background: #fff;
        }
        #capture-btn::after {
            content: '';
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #000;
        }
        #capture-btn:active::after { background: #ccc; }
        #switch-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        #gallery {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        #gallery.active { display: flex; }
        #gallery img {
            flex: 1;
            object-fit: contain;
            width: 100%;
        }
        #gallery-controls {
            padding: 20px;
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.8);
        }
        #gallery-controls button {
            width: 60px;
            height: 60px;
            font-size: 20px;
        }
        .close-btn { background: #ff4444 !important; color: #fff !important; }
        .download-btn { background: #4CAF50 !important; color: #fff !important; }
        .hidden { display: none !important; }
        #flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.1s;
        }
        #flash.active { opacity: 1; }
        #counter {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
        }
        #counter.active { display: block; }
        #error-msg {
            color: #ff4444;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            display: none;
        }
        #permission-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            z-index: 200;
            gap: 24px;
        }
        #permission-screen.hidden { display: none !important; }
        #permission-screen .icon { font-size: 80px; }
        #permission-screen h2 { font-size: 24px; }
        #permission-screen p { opacity: 0.7; font-size: 16px; line-height: 1.5; }
        #grant-btn {
            width: auto;
            height: auto;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            background: #fff;
            color: #000;
        }
        #retry-btn {
            width: auto;
            height: auto;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        .spinner.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            font-size: 14px;
            opacity: 0.7;
            display: none;
        }
        #loading-text.active { display: block; }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }
        #activity-log {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0,0,0,0.55);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.5;
            display: none;
            z-index: 20;
            pointer-events: none;
        }
        #activity-log.active { display: block; }
        #activity-log div { opacity: 0.9; }
        #model-status {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            z-index: 20;
            display: none;
        }
        #model-status.active { display: block; }
    </style>
</head>
<body>
    <div id="flash"></div>

    <!-- Permission Screen -->
    <div id="permission-screen">
        <div class="icon">📷</div>
        <h2>Camera Access</h2>
        <p>This app needs access to your camera to take photos. Your camera data stays on your device and is never uploaded.</p>
        <button id="grant-btn">Allow Camera Access</button>
        <div class="spinner" id="spinner"></div>
        <p id="loading-text">Requesting permission...</p>
        <button id="retry-btn" class="hidden">Try Again</button>
    </div>

    <div id="video-container">
        <div id="placeholder">
            <div class="icon">📷</div>
            <p>Camera is ready</p>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="model-status">Loading detector…</div>
        <div id="counter">📸 <span id="photo-count">0</span></div>
        <div id="activity-log"></div>
    </div>

    <div id="error-msg"></div>

    <div id="controls">
        <button id="start-btn" title="Start Camera">▶️</button>
        <button id="capture-btn" class="hidden" title="Take Photo"></button>
        <button id="switch-btn" class="hidden" title="Switch Camera">🔄</button>
    </div>

    <div id="gallery">
        <img id="gallery-img" src="" alt="Captured photo">
        <div id="gallery-controls">
            <button class="close-btn" title="Close">❌</button>
            <button class="download-btn" title="Download">💾</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const switchBtn = document.getElementById('switch-btn');
        const placeholder = document.getElementById('placeholder');
        const gallery = document.getElementById('gallery');
        const galleryImg = document.getElementById('gallery-img');
        const flash = document.getElementById('flash');
        const counter = document.getElementById('counter');
        const photoCount = document.getElementById('photo-count');
        const errorMsg = document.getElementById('error-msg');
        const permissionScreen = document.getElementById('permission-screen');
        const grantBtn = document.getElementById('grant-btn');
        const retryBtn = document.getElementById('retry-btn');
        const spinner = document.getElementById('spinner');
        const loadingText = document.getElementById('loading-text');

        let stream = null;
        let currentFacing = 'environment';
        let photos = [];
        let permissionGranted = false;

        // --- Agentic tracking layer ---
        const overlay = document.getElementById('overlay');
        const overlayCtx = overlay.getContext('2d');
        const modelStatus = document.getElementById('model-status');
        const activityLog = document.getElementById('activity-log');

        let detector = null;
        let detectorPromise = null;
        let detectLoopRunning = false;
        let tracks = [];       // persistent tracked objects: {id, class, box:[x,y,w,h], lastSeen, lost}
        let nextTrackId = 1;
        const IOU_MATCH_THRESHOLD = 0.3;
        const MAX_LOST_FRAMES = 20; // ~ keep "state memory" this many missed frames before dropping

        // rule-based action-binding table: class -> handler
        const ACTION_TABLE = {
            'potted plant': (track) => logAction(`🌱 Health-log started for ${track.label}`),
            'person':       (track) => logAction(`🧍 Follow-mode engaged for ${track.label}`),
            'bottle':       (track) => logAction(`🏷️ Price-lookup started for ${track.label}`),
            'cell phone':   (track) => logAction(`🏷️ Price-lookup started for ${track.label}`),
            'cup':          (track) => logAction(`🏷️ Price-lookup started for ${track.label}`),
            'book':         (track) => logAction(`🏷️ Price-lookup started for ${track.label}`),
        };
        const DEFAULT_ACTION = (track) => logAction(`ℹ️ No workflow bound to "${track.label}" yet`);

        function logAction(msg) {
            activityLog.classList.add('active');
            const line = document.createElement('div');
            line.textContent = msg;
            activityLog.prepend(line);
            while (activityLog.children.length > 6) activityLog.removeChild(activityLog.lastChild);
        }

        function iou(a, b) {
            const [ax, ay, aw, ah] = a, [bx, by, bw, bh] = b;
            const x1 = Math.max(ax, bx), y1 = Math.max(ay, by);
            const x2 = Math.min(ax + aw, bx + bw), y2 = Math.min(ay + ah, by + bh);
            const interW = Math.max(0, x2 - x1), interH = Math.max(0, y2 - y1);
            const interArea = interW * interH;
            const unionArea = aw * ah + bw * bh - interArea;
            return unionArea <= 0 ? 0 : interArea / unionArea;
        }

        // Rule-based tracker: matches new detections to existing tracks by IOU,
        // with a spatial-distance tiebreaker to reduce ID swaps among overlapping objects.
        function updateTracks(detections) {
            const unmatched = new Set(tracks.map((_, i) => i));
            const assigned = new Set();

            detections.forEach((det) => {
                let bestIou = 0, bestIdx = -1, bestScore = -1;
                tracks.forEach((t, i) => {
                    if (assigned.has(i) || t.class !== det.class) return;
                    const iouScore = iou(t.box, det.box);

                    // Spatial tiebreaker to reduce ID swaps among overlapping objects
                    const tcx = t.box[0] + t.box[2] / 2;
                    const tcy = t.box[1] + t.box[3] / 2;
                    const dcx = det.box[0] + det.box[2] / 2;
                    const dcy = det.box[1] + det.box[3] / 2;
                    const dist = Math.hypot(tcx - dcx, tcy - dcy);
                    const maxDim = Math.max(video.videoWidth || 1, video.videoHeight || 1);
                    const distScore = 1 - Math.min(dist / maxDim, 1);
                    const score = iouScore * 0.7 + distScore * 0.3;

                    if (score > bestScore) {
                        bestScore = score;
                        bestIou = iouScore;
                        bestIdx = i;
                    }
                });

                if (bestIdx !== -1 && bestIou >= IOU_MATCH_THRESHOLD) {
                    const t = tracks[bestIdx];
                    t.box = det.box;
                    t.lastSeen = 0;
                    t.lost = false;
                    assigned.add(bestIdx);
                    unmatched.delete(bestIdx);
                } else {
                    tracks.push({
                        id: nextTrackId++,
                        class: det.class,
                        label: det.class,
                        box: det.box,
                        lastSeen: 0,
                        lost: false,
                        bound: false
                    });
                }
            });

            unmatched.forEach((i) => {
                tracks[i].lastSeen++;
                tracks[i].lost = tracks[i].lastSeen > 3;
            });

            tracks = tracks.filter((t) => t.lastSeen <= MAX_LOST_FRAMES);
        }

        // Coordinate mapping: video native pixels -> overlay canvas pixels.
        // Accounts for object-fit: cover (uniform scale with crop offsets).
        function getVideoToCanvasTransform() {
            const vW = video.videoWidth || 1;
            const vH = video.videoHeight || 1;
            const cW = overlay.width;
            const cH = overlay.height;
            const scale = Math.max(cW / vW, cH / vH);
            const offsetX = (vW * scale - cW) / 2;
            const offsetY = (vH * scale - cH) / 2;
            return { scale, offsetX, offsetY };
        }

        function videoToCanvasRect([vx, vy, vw, vh]) {
            const { scale, offsetX, offsetY } = getVideoToCanvasTransform();
            return [vx * scale - offsetX, vy * scale - offsetY, vw * scale, vh * scale];
        }

        function drawTracks() {
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
            tracks.forEach((t) => {
                if (t.lastSeen > 0) return;
                const [x, y, w, h] = videoToCanvasRect(t.box);
                if (w <= 0 || h <= 0) return;
                overlayCtx.strokeStyle = t.bound ? '#4CAF50' : '#00E5FF';
                overlayCtx.lineWidth = 2;
                overlayCtx.strokeRect(x, y, w, h);
                overlayCtx.fillStyle = t.bound ? '#4CAF50' : '#00E5FF';
                const text = `${t.label} #${t.id}`;
                const textW = overlayCtx.measureText(text).width;
                overlayCtx.fillRect(x, y - 18, textW + 10, 18);
                overlayCtx.fillStyle = '#000';
                overlayCtx.font = '12px -apple-system, sans-serif';
                overlayCtx.fillText(text, x + 5, y - 5);
            });
        }

        async function loadDetector() {
            if (detector) return;
            if (detectorPromise) {
                await detectorPromise;
                return;
            }
            try {
                modelStatus.classList.add('active');
                detectorPromise = cocoSsd.load({ base: 'lite_mobilenet_v2' });
                detector = await detectorPromise;
                modelStatus.textContent = 'Detector ready';
                setTimeout(() => modelStatus.classList.remove('active'), 1500);
            } catch (err) {
                console.error('Detector load error:', err);
                modelStatus.textContent = 'Detector failed to load';
                detectorPromise = null;
            }
        }

        async function detectLoop() {
            if (!detectLoopRunning || !detector || !stream) return;

            try {
                const preds = await detector.detect(video);
                const detections = preds
                    .filter((p) => p.score > 0.55)
                    .map((p) => ({ class: p.class, box: p.bbox }));
                updateTracks(detections);
                drawTracks();
            } catch (err) {
                console.error('Detect error:', err);
            }

            requestAnimationFrame(detectLoop);
        }

        function resizeOverlay() {
            overlay.width = video.clientWidth;
            overlay.height = video.clientHeight;
        }

        overlay.addEventListener('click', (e) => {
            const rect = overlay.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const hit = tracks.find((t) => {
                if (t.lastSeen > 0) return false;
                const [bx, by, bw, bh] = videoToCanvasRect(t.box);
                return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
            });

            if (!hit) return;
            if (hit.bound) return; // already bound — no re-fire
            hit.bound = true;
            const action = ACTION_TABLE[hit.class] || DEFAULT_ACTION;
            action(hit);
        });

        // Check browser support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showPermissionError('Your browser does not support camera access. Please use Chrome, Safari, or Firefox.');
            grantBtn.style.display = 'none';
        }

        function showPermissionError(msg) {
            const p = permissionScreen.querySelector('p');
            p.textContent = msg;
            p.style.color = '#ff4444';
            spinner.classList.remove('active');
            loadingText.classList.remove('active');
            grantBtn.classList.add('hidden');
            retryBtn.classList.remove('hidden');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
        }

        async function requestPermission() {
            spinner.classList.add('active');
            loadingText.classList.add('active');
            grantBtn.classList.add('hidden');

            try {
                // First, try to enumerate devices to see if cameras exist
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                if (videoDevices.length === 0) {
                    showPermissionError('No camera found on this device.');
                    return;
                }

                // Now request actual permission
                const testStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacing },
                    audio: false
                });

                // Permission granted! Stop the test stream
                testStream.getTracks().forEach(track => track.stop());

                permissionGranted = true;
                permissionScreen.classList.add('hidden');

                // Auto-start camera
                await startCamera();

            } catch (err) {
                console.error('Permission error:', err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showPermissionError('Camera permission was denied. Please allow camera access in your browser settings and tap Try Again.');
                } else if (err.name === 'NotFoundError') {
                    showPermissionError('No camera found on this device.');
                } else if (err.name === 'NotReadableError') {
                    showPermissionError('Camera is already in use by another app. Please close other apps using the camera.');
                } else {
                    showPermissionError('Could not access camera: ' + err.message);
                }
            }
        }

        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: currentFacing,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                video.classList.add('active');
                placeholder.style.display = 'none';
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                switchBtn.classList.remove('hidden');
                counter.classList.add('active');

                resizeOverlay();
                tracks = [];
                if (!detector) await loadDetector();
                if (!detectLoopRunning) {
                    detectLoopRunning = true;
                    requestAnimationFrame(detectLoop);
                }

            } catch (err) {
                console.error('Camera start error:', err);
                showError('Failed to start camera: ' + err.message);
                // Show permission screen again
                permissionScreen.classList.remove('hidden');
                showPermissionError('Could not start camera. Please check permissions.');
            }
        }

        function takePhoto() {
            if (!stream) return;

            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;

            const ctx = canvas.getContext('2d');

            if (currentFacing === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0);

            const photoData = canvas.toDataURL('image/jpeg', 0.9);
            photos.push(photoData);
            photoCount.textContent = photos.length;

            galleryImg.src = photoData;
            gallery.classList.add('active');
        }

        function switchCamera() {
            currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        function closeGallery() {
            gallery.classList.remove('active');
        }

        function downloadPhoto() {
            const link = document.createElement('a');
            link.download = `photo_${photos.length}_${Date.now()}.jpg`;
            link.href = galleryImg.src;
            link.click();
        }

        // Event listeners
        grantBtn.addEventListener('click', requestPermission);
        retryBtn.addEventListener('click', requestPermission);
        startBtn.addEventListener('click', startCamera);
        captureBtn.addEventListener('click', takePhoto);
        switchBtn.addEventListener('click', switchCamera);
        document.querySelector('.close-btn').addEventListener('click', closeGallery);
        document.querySelector('.download-btn').addEventListener('click', downloadPhoto);

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        window.addEventListener('resize', resizeOverlay);
    </script>
</body>
</html>
