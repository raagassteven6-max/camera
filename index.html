<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Tracker HUD</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #stage {
        position: relative;
        width: 100vw; height: 100vh;
    }
    #video {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }
    #overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 10;
    }
    #hud-top {
        position: absolute;
        top: 12px; left: 12px; right: 12px;
        display: flex; justify-content: space-between;
        z-index: 20;
        pointer-events: none;
    }
    #status {
        background: rgba(0,0,0,0.55);
        padding: 6px 12px;
        border-radius: 14px;
        font-size: 12px;
        color: #0f0;
    }
    #fps {
        background: rgba(0,0,0,0.55);
        padding: 6px 12px;
        border-radius: 14px;
        font-size: 12px;
        color: #0ff;
    }
    #start-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #111;
        z-index: 30;
    }
    #start-btn {
        padding: 16px 32px;
        border-radius: 30px;
        border: none;
        background: #00e5ff;
        color: #000;
        font-size: 16px;
        font-weight: 600;
    }
    #start-overlay.hidden { display: none; }

    #target-preview {
        position: absolute;
        top: 52px; left: 12px;
        width: 80px; height: 80px;
        border: 2px solid #FFD600;
        border-radius: 8px;
        z-index: 20;
        display: none;
        background: #000;
    }
    #target-preview.active { display: block; }
    #target-label {
        position: absolute;
        top: 136px; left: 12px;
        max-width: 200px;
        background: rgba(0,0,0,0.6);
        color: #FFD600;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 8px;
        z-index: 20;
        display: none;
    }
    #target-label.active { display: block; }

    #ask-bar {
        position: absolute;
        bottom: 12px; left: 12px; right: 12px;
        display: flex; gap: 8px;
        z-index: 20;
    }
    #ask-input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: none;
        background: rgba(255,255,255,0.9);
        font-size: 14px;
    }
    #ask-btn {
        padding: 10px 18px;
        border-radius: 20px;
        border: none;
        background: #FFD600;
        font-weight: 600;
        font-size: 14px;
    }

    #bridge-debug {
        position: absolute;
        bottom: 64px; left: 12px; right: 12px;
        max-height: 32vh;
        overflow-y: auto;
        background: rgba(0,0,0,0.75);
        color: #9CFF9C;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        padding: 8px 10px;
        border-radius: 10px;
        z-index: 20;
        display: none;
        white-space: pre-wrap;
    }
    #bridge-debug.active { display: block; }
</style>
</head>
<body>
<div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="hud-top">
        <div id="status">Loading…</div>
        <div id="fps">0 fps</div>
    </div>
    <canvas id="target-preview" width="80" height="80"></canvas>
    <div id="target-label"></div>
    <div id="bridge-debug"></div>
    <div id="ask-bar">
        <input id="ask-input" type="text" placeholder="Ask about what's in view…">
        <button id="ask-btn">Ask</button>
    </div>
    <div id="start-overlay">
        <button id="start-btn">Start Live Tracker</button>
    </div>
</div>

<script type="module">
import {
    FilesetResolver,
    ObjectDetector,
    FaceDetector
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const overlayCtx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const fpsEl = document.getElementById('fps');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const targetPreview = document.getElementById('target-preview');
const targetPreviewCtx = targetPreview.getContext('2d');
const targetLabel = document.getElementById('target-label');
const bridgeDebug = document.getElementById('bridge-debug');
const askInput = document.getElementById('ask-input');
const askBtn = document.getElementById('ask-btn');

let lockedId = null;

let objectDetector = null;
let faceDetector = null;
let running = false;
let tracks = [];
let nextTrackId = 1;

const IOU_MATCH_THRESHOLD = 0.15;
const MAX_LOST_FRAMES = 6;
const MIN_SCORE = 0.6;

// --- fps counter ---
let frameTimes = [];
function tickFps() {
    const now = performance.now();
    frameTimes.push(now);
    frameTimes = frameTimes.filter((t) => now - t < 1000);
    fpsEl.textContent = `${frameTimes.length} fps`;
}

// --- coordinate mapping: video native pixels -> canvas (object-fit: cover aware) ---
function getTransform() {
    const scale = Math.max(overlay.width / video.videoWidth, overlay.height / video.videoHeight);
    const offsetX = (video.videoWidth * scale - overlay.width) / 2;
    const offsetY = (video.videoHeight * scale - overlay.height) / 2;
    return { scale, offsetX, offsetY };
}
function toCanvasRect([vx, vy, vw, vh]) {
    const { scale, offsetX, offsetY } = getTransform();
    return [vx * scale - offsetX, vy * scale - offsetY, vw * scale, vh * scale];
}

function resizeOverlay() {
    overlay.width = video.clientWidth;
    overlay.height = video.clientHeight;
}
window.addEventListener('resize', resizeOverlay);

// --- rule-based IOU + centroid tracker (model-agnostic) ---
function iou(a, b) {
    const [ax, ay, aw, ah] = a, [bx, by, bw, bh] = b;
    const x1 = Math.max(ax, bx), y1 = Math.max(ay, by);
    const x2 = Math.min(ax + aw, bx + bw), y2 = Math.min(ay + ah, by + bh);
    const interW = Math.max(0, x2 - x1), interH = Math.max(0, y2 - y1);
    const interArea = interW * interH;
    const unionArea = aw * ah + bw * bh - interArea;
    return unionArea <= 0 ? 0 : interArea / unionArea;
}

function updateTracks(detections, ranFace) {
    const assigned = new Set();

    detections.forEach((det) => {
        let bestScore = 0, bestIdx = -1;
        tracks.forEach((t, i) => {
            if (assigned.has(i) || t.class !== det.class) return;
            const iouScore = iou(t.box, det.box);
            if (iouScore < IOU_MATCH_THRESHOLD) return;
            const [tcx, tcy] = [t.box[0] + t.box[2] / 2, t.box[1] + t.box[3] / 2];
            const [dcx, dcy] = [det.box[0] + det.box[2] / 2, det.box[1] + det.box[3] / 2];
            const dist = Math.hypot(tcx - dcx, tcy - dcy);
            const maxDim = Math.max(video.videoWidth, video.videoHeight);
            const distScore = 1 - Math.min(dist / maxDim, 1);
            const score = iouScore * 0.7 + distScore * 0.3;
            if (score > bestScore) { bestScore = score; bestIdx = i; }
        });

        if (bestIdx !== -1) {
            const t = tracks[bestIdx];
            t.box = det.box;
            t.score = det.score;
            t.lastSeen = 0;
            assigned.add(bestIdx);
        } else {
            tracks.push({
                id: nextTrackId++,
                class: det.class,
                box: det.box,
                score: det.score,
                lastSeen: 0
            });
        }
    });

    // Only age tracks whose detector actually ran this frame — the other
    // group's boxes just hold their last known position until their turn.
    tracks.forEach((t, i) => {
        if (assigned.has(i)) return;
        const isFaceTrack = t.class === 'face';
        if (isFaceTrack === ranFace) t.lastSeen++;
    });

    tracks = tracks.filter((t) => t.lastSeen <= MAX_LOST_FRAMES);
}

function drawTracks() {
    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
    tracks.forEach((t) => {
        if (t.lastSeen > 0) return; // strictly live — hide immediately if not currently detected
        const [x, y, w, h] = toCanvasRect(t.box);
        const isLocked = t.id === lockedId;
        const isTarget = t === getCurrentTarget();
        const color = isLocked ? '#FFD600' : (t.class === 'face' ? '#FF3D9A' : '#00E5FF');
        overlayCtx.strokeStyle = color;
        overlayCtx.lineWidth = isLocked ? 3 : (isTarget ? 3 : 2);
        overlayCtx.strokeRect(x, y, w, h);
        const label = `${isLocked ? '🔒 ' : ''}${t.class} #${t.id} ${(t.score * 100).toFixed(0)}%`;
        overlayCtx.font = '13px -apple-system, sans-serif';
        const textW = overlayCtx.measureText(label).width;
        overlayCtx.fillStyle = color;
        overlayCtx.fillRect(x, Math.max(0, y - 18), textW + 10, 18);
        overlayCtx.fillStyle = '#000';
        overlayCtx.fillText(label, x + 5, Math.max(12, y - 5));
    });
}

// --- targeting: locked track wins, else dominant (largest area, tiebreak by score), else null ---
function getCurrentTarget() {
    const live = tracks.filter((t) => t.lastSeen === 0);
    if (live.length === 0) return null;

    if (lockedId !== null) {
        const locked = live.find((t) => t.id === lockedId);
        if (locked) return locked;
        lockedId = null; // locked object left frame — fall through to dominant
    }

    return live.reduce((best, t) => {
        const area = t.box[2] * t.box[3];
        const bestArea = best.box[2] * best.box[3];
        if (area > bestArea) return t;
        if (area === bestArea && t.score > best.score) return t;
        return best;
    });
}

// --- 3x3 zone quantization to kill jitter in position descriptions ---
function quantizeZone(box) {
    const [x, y, w, h] = box;
    const cx = (x + w / 2) / video.videoWidth;
    const cy = (y + h / 2) / video.videoHeight;
    const col = cx < 1 / 3 ? 'left' : cx < 2 / 3 ? 'center' : 'right';
    const row = cy < 1 / 3 ? 'top' : cy < 2 / 3 ? 'middle' : 'bottom';
    if (row === 'middle' && col === 'center') return 'center';
    return `${row}-${col}`;
}

function sizeDescriptor(box) {
    const areaFrac = (box[2] * box[3]) / (video.videoWidth * video.videoHeight);
    if (areaFrac > 0.35) return 'close';
    if (areaFrac > 0.1) return 'medium distance';
    return 'far';
}

// --- geometry-only scene state, rebuilt fresh each call, always current, no history to manage ---
function buildSceneState() {
    const live = tracks.filter((t) => t.lastSeen === 0);
    const target = getCurrentTarget();

    if (live.length === 0) {
        return { text: 'Nothing currently detected in view.', target: null };
    }

    const lines = live.map((t) => {
        const marker = t === target ? ' [TARGET]' : '';
        const lockMarker = t.id === lockedId ? ' [LOCKED BY USER]' : '';
        return `${t.class} #${t.id} (${quantizeZone(t.box)}, ${sizeDescriptor(t.box)}, ${(t.score * 100).toFixed(0)}% confidence)${marker}${lockMarker}`;
    });

    return {
        text: `Current scene:\n${lines.join('\n')}`,
        target
    };
}

// --- crop the target region from the live video into the preview canvas (native pixels) ---
function drawTargetPreview(target) {
    if (!target) {
        targetPreview.classList.remove('active');
        targetLabel.classList.remove('active');
        return;
    }
    const [x, y, w, h] = target.box;
    // pad slightly so the crop isn't razor-tight to the box
    const pad = 0.15;
    const px = Math.max(0, x - w * pad);
    const py = Math.max(0, y - h * pad);
    const pw = Math.min(video.videoWidth - px, w * (1 + pad * 2));
    const ph = Math.min(video.videoHeight - py, h * (1 + pad * 2));

    targetPreviewCtx.clearRect(0, 0, 80, 80);
    targetPreviewCtx.drawImage(video, px, py, pw, ph, 0, 0, 80, 80);
    targetPreview.classList.add('active');

    targetLabel.textContent = `${lockedId === target.id ? '🔒 locked' : 'auto-target'}: ${target.class} #${target.id}`;
    targetLabel.classList.add('active');
}

// --- tap-to-lock: tap a box to lock it as the target, tap it again (or empty space) to release ---
overlay.addEventListener('click', (e) => {
    const rect = overlay.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const hit = tracks.find((t) => {
        if (t.lastSeen > 0) return false;
        const [bx, by, bw, bh] = toCanvasRect(t.box);
        return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
    });

    if (!hit) {
        lockedId = null;
        return;
    }
    lockedId = (lockedId === hit.id) ? null : hit.id;
});

// --- Ask: builds the exact payload the VLM+Stef pipeline would receive.
// No model wired yet — this just shows what would be sent, per the plan
// to tune the bridge before adding inference on top. ---
function handleAsk() {
    const question = askInput.value.trim();
    if (!question) return;

    const scene = buildSceneState();
    drawTargetPreview(scene.target);

    const targetDesc = scene.target
        ? `${scene.target.class} #${scene.target.id} (${quantizeZone(scene.target.box)}, ${sizeDescriptor(scene.target.box)})`
        : 'none — whole frame';

    const payload =
`[VLM call — would crop to: ${targetDesc}]
[VLM description: <not wired yet>]

${scene.text}

User question: "${question}"

[This full block → Stef]`;

    bridgeDebug.textContent = payload;
    bridgeDebug.classList.add('active');
    askInput.value = '';
}
askBtn.addEventListener('click', handleAsk);
askInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAsk(); });

// --- detection loop: self-chaining, gated on completion (no pile-up) ---
let frameCount = 0;
async function detectLoop() {
    if (!running) return;

    if (video.readyState < 2 || video.videoWidth === 0) {
        requestAnimationFrame(detectLoop);
        return;
    }

    const ts = performance.now();
    const detections = [];
    const runFace = frameCount % 2 === 1;
    frameCount++;
    const inferenceStart = performance.now();

    try {
        if (!runFace) {
            const objResult = objectDetector.detectForVideo(video, ts);
            objResult.detections.forEach((d) => {
                const cat = d.categories[0];
                if (cat.score < MIN_SCORE) return;
                const bb = d.boundingBox;
                detections.push({
                    class: cat.categoryName,
                    score: cat.score,
                    box: [bb.originX, bb.originY, bb.width, bb.height]
                });
            });
        } else {
            const faceResult = faceDetector.detectForVideo(video, ts);
            faceResult.detections.forEach((d) => {
                const score = d.categories?.[0]?.score ?? 0;
                if (score < MIN_SCORE) return;
                const bb = d.boundingBox;
                detections.push({
                    class: 'face',
                    score,
                    box: [bb.originX, bb.originY, bb.width, bb.height]
                });
            });
        }

        const inferenceMs = (performance.now() - inferenceStart).toFixed(0);
        statusEl.textContent = `Live — ${runFace ? 'face' : 'object'} model: ${inferenceMs}ms`;

        updateTracks(detections, runFace);
        drawTracks();
        drawTargetPreview(getCurrentTarget());
        tickFps();
    } catch (err) {
        console.error('Detect error:', err);
        statusEl.textContent = 'Error: ' + err.message;
    }

    requestAnimationFrame(detectLoop);
}

async function loadModels() {
    statusEl.textContent = 'Loading models…';
    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
    );

    const [obj, face] = await Promise.all([
        ObjectDetector.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            scoreThreshold: MIN_SCORE,
            maxResults: 10
        }),
        FaceDetector.createFromOptions(vision, {
            baseOptions: {
                // full-range: back camera / faces up to ~5m — short-range is selfie-only (<2m)
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite",
                delegate: "GPU"
            },
            runningMode: "VIDEO"
        })
    ]);
    objectDetector = obj;
    faceDetector = face;

    statusEl.textContent = 'Live';
}

async function start() {
    startOverlay.classList.add('hidden');
    statusEl.textContent = 'Starting camera…';

    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
    });
    video.srcObject = stream;

    await new Promise((resolve) => {
        video.addEventListener('loadedmetadata', () => { video.play(); resolve(); }, { once: true });
    });

    resizeOverlay();
    await loadModels();

    running = true;
    requestAnimationFrame(detectLoop);
}

startBtn.addEventListener('click', () => {
    start().catch((err) => {
        console.error(err);
        statusEl.textContent = 'Error: ' + err.message;
        startOverlay.classList.remove('hidden');
    });
});
</script>
</body>
</html>
